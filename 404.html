<script>
/* 只处理主题：读 localStorage，回退到系统偏好，不依赖站点其它脚本 */
(function () {
  var KEY = 'ky.site.theme';
  function apply(t) {
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#161513' : '#faf9f7');
    var b = document.querySelector('[data-theme-btn]');
    if (b) b.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  var want = null;
  try { want = localStorage.getItem(KEY); } catch (e) {}
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  apply(want || (dark ? 'dark' : 'light'));
  var btn = document.querySelector('[data-theme-btn]');
  if (btn) btn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var nxt = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(KEY, nxt); } catch (e) {}
    apply(nxt);
  });
})();
</script>
